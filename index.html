  <!-- ============================================================
       PÁGINA AUTÓNOMA
       - Toda la información vive aquí (constante SEGMENTOS, más abajo).
       - No depende de Google Sheets ni de TimelineJS.
       - Para actualizar datos: edita el arreglo SEGMENTOS y guarda.
       ============================================================ -->

  <style>
    :root{
      --guinda:#691c32;
      --guinda-2:#96606f;
      --tinta:#2a2226;
      --gris:#6b6b6b;
      --linea:#e3d6da;
      --ok:#1f7a4d;
      --alerta:#b3261e;
      --bg:#f7f4f5;
      --card:#ffffff;
      --radio:14px;
      --sombra:0 6px 22px rgba(105,28,50,.10);
    }
    *{ box-sizing:border-box; }
    html,body{ margin:0; padding:0; }
    body{
      font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
      color:var(--tinta);
      background:var(--bg);
      line-height:1.5;
    }
    a{ color:var(--guinda-2); }

    /* ---------- Encabezado ---------- */
    .hero{
      position:relative;
      background:linear-gradient(135deg,var(--guinda),#4a1322);
      color:#fff;
      padding:9px 20px;
      text-align:center;
      overflow:hidden;
    }
    .hero img.mapa{
      position:absolute; inset:0; width:100%; height:100%;
      object-fit:cover; opacity:.16; filter:grayscale(.2);
    }
    .hero .wrap{
      position:relative; max-width:1180px; margin:0 auto;
      display:flex; align-items:center; justify-content:space-between; gap:6px 22px; flex-wrap:wrap;
    }
    .hero .hgroup{ display:flex; flex-direction:column; align-items:flex-start; gap:1px; text-align:left; }
    .hero h1{ margin:0; font-size:clamp(16px,2.4vw,22px); letter-spacing:.3px; }
    .hero .sub{ opacity:.85; font-size:clamp(11px,1.6vw,13px); }
    .hero .resumen{
      margin:0; display:flex; gap:8px; flex-wrap:wrap; justify-content:center;
    }
    .chip{
      background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25);
      border-radius:999px; padding:4px 11px; font-size:12px; backdrop-filter:blur(2px);
    }
    .chip, .chip b{ font-size:12px; font-weight:400; }

    /* ---------- Dirección del proyecto ---------- */
    .direccion{ max-width:1000px; margin:14px auto 0; padding:0 14px; }
    .dir-wrap{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
    .dir-card{
      flex:1 1 260px; max-width:430px;
      background:var(--card); border:1px solid var(--linea); border-left:4px solid var(--guinda);
      border-radius:12px; padding:10px 14px; box-shadow:var(--sombra);
    }
    .dir-card .dir-rol{
      display:block; font-size:11px; text-transform:uppercase; letter-spacing:.6px;
      color:var(--guinda); font-weight:800;
    }
    .dir-card .dir-nom{ display:block; font-size:15px; font-weight:700; color:var(--tinta); }

    /* ---------- Línea del tiempo estilo presentación (TimelineJS) ---------- */
    .tl{ max-width:1000px; margin:14px auto 0; }
    .slide-wrap{ position:relative; padding:20px 14px 10px; }
    .nav-arrow{
      position:absolute; top:46%; transform:translateY(-50%); z-index:5;
      width:46px; height:46px; border-radius:50%; border:0; cursor:pointer;
      background:var(--guinda); color:#fff; font-size:26px; line-height:1;
      box-shadow:0 4px 14px rgba(105,28,50,.35);
    }
    .nav-arrow:hover{ background:var(--guinda-2); }
    .nav-arrow.prev{ left:0; } .nav-arrow.next{ right:0; }
    .nav-arrow[disabled]{ opacity:.25; cursor:default; }
    .item{ animation:fade .28s ease; }
    @keyframes fade{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

    /* Fechas de inicio y término, bien visibles */
    .fechas{ display:flex; align-items:center; justify-content:center; gap:6px; margin:0 0 12px; flex-wrap:wrap; }
    .fechas .f{ text-align:center; padding:6px 18px; }
    .fechas .f .lbl{ font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--gris); }
    .fechas .f .val{ font-size:18px; font-weight:800; color:var(--guinda); }
    .fechas .flecha-f{ color:var(--guinda-2); font-size:22px; }

    /* Barra de navegación inferior */
    .timenav{
      position:sticky; bottom:0; z-index:6; margin-top:18px;
      background:#fff; border-top:1px solid var(--linea); box-shadow:0 -4px 16px rgba(105,28,50,.08);
      padding:14px 0 12px;
    }
    /* Carril que corre como carrusel (scroll horizontal suave) */
    .timenav-scroll{ overflow-x:auto; overflow-y:hidden; scroll-behavior:smooth; padding:6px 0 4px; }
    .timenav-inner{ position:relative; margin:0; }   /* width y height se fijan por JS */

    /* Eje y marcas de tiempo (años en grande, meses tenues) */
    .eje{ position:absolute; left:0; right:0; height:3px; background:var(--linea); border-radius:3px; }
    .tick-mes{ position:absolute; transform:translateX(-50%); text-align:center; color:#b9aeb2; font-size:10px; }
    .tick-mes i{ display:block; width:1px; height:7px; background:var(--linea); margin:0 auto 2px; }
    .tick-anio{ position:absolute; transform:translateX(-50%); text-align:center; color:var(--guinda); font-weight:800; font-size:14px; }
    .tick-anio i{ display:block; width:2px; height:12px; background:var(--guinda-2); margin:0 auto 3px; }

    /* Marcador de cada segmento (no se encima: se apila en niveles) */
    .marker{ position:absolute; top:0; }
    .marker .m-stem{ position:absolute; left:-1px; width:2px; background:var(--linea); }
    .marker .m-dot{
      position:absolute; left:-7px; width:14px; height:14px; border-radius:50%;
      background:#fff; border:3px solid var(--guinda-2); box-sizing:border-box; transition:.15s;
    }
    .marker .m-card{
      position:absolute; transform:translateX(-50%); width:160px; cursor:pointer;
      background:#faf6f7; border:1px solid var(--linea); border-radius:8px; padding:6px 8px;
      text-align:center; transition:.15s; line-height:1.2;
    }
    .marker .m-card b{ display:block; font-size:11.5px; color:var(--tinta); white-space:normal; word-break:break-word; }
    .marker .m-card span{ font-size:10px; color:var(--gris); }
    .marker:hover .m-card{ border-color:var(--guinda-2); }
    .marker.activo .m-card{ background:var(--guinda); border-color:var(--guinda); }
    .marker.activo .m-card b{ color:#fff; }
    .marker.activo .m-card span{ color:rgba(255,255,255,.85); }
    .marker.activo .m-dot{ border-color:var(--guinda); background:var(--guinda); transform:scale(1.15); }
    .marker.activo .m-stem{ background:var(--guinda); }

    .contador{ text-align:center; color:var(--gris); font-size:12px; margin-top:8px; }

    /* Botón pestaña para contraer / expandir la línea del tiempo */
    .tn-toggle{
      position:absolute; top:-17px; left:50%; transform:translateX(-50%);
      display:inline-flex; align-items:center; gap:8px;
      background:var(--guinda); color:#fff; border:0; border-radius:999px;
      padding:7px 18px; font-size:13px; font-weight:700; cursor:pointer;
      box-shadow:0 5px 16px rgba(105,28,50,.35); white-space:nowrap; z-index:7;
      animation:palpitar 0.9s ease 0.7s 3;   /* late 3 veces al cargar y se detiene */
    }
    .tn-toggle:hover{ background:var(--guinda-2); }
    @keyframes palpitar{
      0%,100%{ transform:translateX(-50%) scale(1);    box-shadow:0 5px 16px rgba(105,28,50,.35); }
      50%    { transform:translateX(-50%) scale(1.09); box-shadow:0 6px 22px rgba(105,28,50,.6), 0 0 0 7px rgba(105,28,50,.18); }
    }
    @media (prefers-reduced-motion:reduce){ .tn-toggle{ animation:none; } }
    .tn-toggle .tn-ico{ display:inline-flex; }
    .tn-toggle .tn-chev{ font-size:15px; line-height:1; transition:transform .3s ease; }
    .timenav.colapsado .tn-toggle .tn-chev{ transform:rotate(180deg); }

    /* Cuerpo plegable con transición suave */
    .tn-body{
      position:relative; overflow:hidden; opacity:1;
      max-height:380px; transition:max-height .35s ease, opacity .25s ease, margin .35s ease;
    }
    .timenav.colapsado{ padding-bottom:6px; }
    .timenav.colapsado .tn-body{ max-height:0; opacity:0; margin:0; }

    /* Flechas dentro de la línea del tiempo */
    .tn-arrow{
      position:absolute; top:calc(50% - 6px); transform:translateY(-50%); z-index:4;
      width:34px; height:34px; border-radius:50%; cursor:pointer;
      background:#fff; color:var(--guinda); border:2px solid var(--guinda);
      font-size:20px; line-height:1; box-shadow:0 2px 8px rgba(105,28,50,.18);
      display:flex; align-items:center; justify-content:center;
    }
    .tn-arrow:hover{ background:var(--guinda); color:#fff; }
    .tn-arrow[disabled]{ opacity:.3; cursor:default; background:#fff; color:var(--guinda); }
    .tn-arrow.prev{ left:8px; } .tn-arrow.next{ right:8px; }
    .timenav-scroll{ margin:0 50px; }

    .card{
      background:var(--card); border-radius:var(--radio); box-shadow:var(--sombra);
      overflow:hidden; border:1px solid var(--linea);
    }
    .card-head{
      background:linear-gradient(135deg,var(--guinda),var(--guinda-2));
      color:#fff; padding:14px 18px;
    }
    .card-head h2{ margin:0; font-size:19px; }
    .card-head .km{ font-size:13px; opacity:.92; margin-top:2px; }
    .card .foto{ width:100%; display:block; max-height:230px; object-fit:cover; background:#efe9eb; cursor:zoom-in; transition:filter .15s; }
    .card .foto:hover{ filter:brightness(.92); }
    .avatar{ width:46px; height:46px; border-radius:50%; object-fit:cover; vertical-align:middle;
             margin-right:9px; border:2px solid var(--linea); cursor:zoom-in; }
    .avatar:hover{ filter:brightness(.92); }
    .avatar-lg{ width:62px; height:62px; border-radius:50%; object-fit:cover; float:left;
                margin:2px 12px 4px 0; border:2px solid var(--linea); cursor:zoom-in; }

    /* ---------- Modal / lightbox de fotos ---------- */
    .modal{
      position:fixed; inset:0; z-index:50; display:none;
      align-items:center; justify-content:center; padding:24px;
      background:rgba(20,8,12,.85); backdrop-filter:blur(2px); cursor:zoom-out;
    }
    .modal.open{ display:flex; }
    .modal img{
      max-width:96vw; max-height:90vh; border-radius:10px;
      box-shadow:0 12px 40px rgba(0,0,0,.5); cursor:default;
    }
    .modal .cerrar{
      position:absolute; top:14px; right:18px; width:42px; height:42px;
      border:0; border-radius:50%; background:rgba(255,255,255,.15); color:#fff;
      font-size:24px; line-height:1; cursor:pointer;
    }
    .modal .cerrar:hover{ background:rgba(255,255,255,.3); }
    .modal .pie{
      position:absolute; bottom:18px; left:0; right:0; text-align:center;
      color:#fff; font-size:14px; opacity:.9; padding:0 20px;
    }
    .card-body{ padding:16px 18px; }

    .filas{ width:100%; border-collapse:collapse; }
    .filas th, .filas td{ text-align:left; padding:6px 0; vertical-align:top; font-size:14px; }
    .filas th{ color:var(--gris); font-weight:600; width:120px; padding-right:12px; }
    .placeholder{ color:#b9b0b3; }

    /* ---------- Avance ---------- */
    .avance{ margin-top:14px; border-top:1px dashed var(--linea); padding-top:12px; }
    .avance .titulo{ font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--gris); }
    .barra{ background:var(--linea); border-radius:999px; height:12px; overflow:hidden; margin:4px 0 2px; }
    .barra > span{ display:block; height:100%; background:linear-gradient(90deg,var(--guinda),var(--guinda-2)); }
    .barra-row{ margin:8px 0; }
    .barra-row .lbl{ display:flex; justify-content:space-between; font-size:13px; }
    .metricas{ display:flex; flex-wrap:wrap; gap:10px 22px; margin-top:10px; font-size:13px; }
    .metricas div span{ display:block; color:var(--gris); font-size:11px; }
    .metricas b{ font-size:14px; }
    .desv-pos{ color:var(--ok); } .desv-neg{ color:var(--alerta); }

    /* ---------- Responsables (desplegable) ---------- */
    .toggle{
      margin-top:14px; background:var(--guinda); border:1px solid var(--guinda); border-radius:10px;
      color:#fff; font-weight:700; cursor:pointer; padding:11px 15px; width:100%;
      text-align:left; font-size:14px; display:flex; justify-content:space-between; align-items:center;
      box-shadow:0 2px 8px rgba(105,28,50,.22); transition:background .15s;
    }
    .toggle:hover{ background:var(--guinda-2); }
    .toggle .flecha{ transition:transform .2s; }
    .detalle{ display:none; padding:6px 2px 2px; }
    .item.open .detalle{ display:block; }
    .item.open .toggle .flecha{ transform:rotate(180deg); }
    .persona{ padding:9px 0; border-bottom:1px solid var(--linea); overflow:hidden; }
    .persona:last-child{ border-bottom:0; }
    .persona .cargo{
      display:inline-block; background:var(--guinda); color:#fff; font-weight:700;
      font-size:10.5px; text-transform:uppercase; letter-spacing:.4px;
      padding:3px 11px; border-radius:999px; margin-bottom:5px;
    }
    .persona .nom{ font-weight:700; }
    .persona .ext{ font-size:13px; color:var(--gris); }

    footer{ text-align:center; padding:22px; color:var(--gris); font-size:12px; }

    @media (max-width:600px){
      .nav-arrow{ width:38px; height:38px; font-size:22px; }
      .slide-wrap{ padding:16px 6px 6px; }
      .fechas .f{ padding:4px 10px; } .fechas .f .val{ font-size:16px; }
      .card-head h2{ font-size:17px; }
      .era .et{ display:none; }
    }
  </style>
</head>

       RENDER · construye la línea del tiempo a partir de SEGMENTOS

  <script>
    const MESES = ['','ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    const esc = s => (s==null?'':String(s))
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const has = s => s!=null && String(s).trim()!=='' && String(s).trim().toUpperCase()!=='XXX';
    const fecha = o => {
      if (!o || !has(o.y)) return '';
      const d = has(o.d) ? o.d+' ' : '';
      const m = has(o.m) ? MESES[+o.m]+' ' : '';
      return d + m + o.y;
    };
    const money = v => { v=(v||'').replace(/\$/g,'').trim(); return v ? '$'+v : '—'; };
    const pct   = v => { v=(v||'').trim(); return v!=='' ? v+'%' : '—'; };
    const numero = v => parseFloat(String(v||'').replace(/[^0-9.\-]/g,'')) || 0;

    function personasDe(s){
      const out = [];
      const add = (cargo, nombre, empresa, email, foto) => {
        if (!has(nombre)) return;
        out.push({ cargo, nombre, empresa: has(empresa)?empresa:'', email: has(email)?email:'', foto: has(foto)?foto:'' });
      };
      add('Residente de Obra', s.residente, '', s.residenteEmail, s.residenteFoto);
      add('Director de Proyecto', s.director, s.empresaDC, '');
      add('Superintendente D&C', s.superDC, s.empresaDC, s.superDCEmail);
      add('Representante Legal', s.repLegal, s.empresaDC, '');
      add('Superintendente de Supervisión', s.superSup, s.empresaSup, s.superSupEmail);
      return out;
    }

    function detalle(s){
      const personas = personasDe(s).map(p => `
        <div class="persona">
          ${p.foto ? `<img class="avatar-lg" data-zoom src="${esc(p.foto)}" alt="${esc(p.nombre)}">` : ''}
          <div class="cargo">${esc(p.cargo)}</div>
          <div class="nom">${esc(p.nombre)}</div>
          ${p.empresa ? `<div class="ext">${esc(p.empresa)}</div>` : ''}
          ${p.email ? `<div class="ext"><a href="mailto:${esc(p.email)}">${esc(p.email)}</a></div>` : ''}
        </div>`).join('');
      const empresas = `
        ${has(s.empresaDC)  ? `<div class="persona"><div class="cargo">Empresa de Diseño y Construcción</div><div class="ext">${esc(s.empresaDC)}</div></div>` : ''}
        ${has(s.empresaSup) ? `<div class="persona"><div class="cargo">Supervisión externa</div><div class="ext">${esc(s.empresaSup)}</div></div>` : ''}`;
      return personas + empresas;
    }

    function avance(s){
      const f = numero(s.avanceFisico), fin = numero(s.avanceFinanciero);
      const desv = String(s.desviacion||'').trim();
      const desvNum = numero(s.desviacion);
      const desvClass = desvNum < 0 ? 'desv-neg' : 'desv-pos';
      const corte = has(s.fechaAvance) ? ` · al ${esc(s.fechaAvance)}` : '';
      return `
        <div class="avance">
          <div class="titulo">Avance${corte}</div>
          <div class="barra-row">
            <div class="lbl"><span>Físico</span><b>${pct(s.avanceFisico)}</b></div>
            <div class="barra"><span style="width:${Math.min(f,100)}%"></span></div>
          </div>
          <div class="barra-row">
            <div class="lbl"><span>Financiero</span><b>${pct(s.avanceFinanciero)}</b></div>
            <div class="barra"><span style="width:${Math.min(fin,100)}%"></span></div>
          </div>
          <div class="metricas">
            <div><span>Desviación</span><b class="${desvClass}">${desv!==''?desv+'%':'—'}</b></div>
            <div><span>Importe del contrato</span><b>${money(s.importe)}</b></div>
            <div><span>Anticipo</span><b>${money(s.anticipo)}</b></div>
          </div>
        </div>`;
    }

    // ---- Una diapositiva (tramo) ----
    function slide(s){
      const foto = has(s.foto) ? s.foto : 'foto-tren.png';
      const ini = fecha(s.inicio), fin = fecha(s.fin);
      return `
        <div class="item">
          <div class="card">
            <div class="card-head">
              <h2>${esc(s.titulo)}</h2>
              <div class="km">${esc(s.km)}</div>
            </div>
            ${foto ? `<img class="foto" data-zoom src="${esc(foto)}" alt="${esc(s.titulo)}" loading="lazy" onerror="this.style.display='none'">` : ''}
            <div class="card-body">
              <div class="fechas">
                <div class="f"><div class="lbl">Inicio</div><div class="val">${ini || '—'}</div></div>
                ${fin ? '<div class="flecha-f">→</div><div class="f"><div class="lbl">Término</div><div class="val">'+fin+'</div></div>' : ''}
              </div>
              <table class="filas">
                <tr><th>Contrato</th><td>${has(s.contrato)?esc(s.contrato):'<span class="placeholder">—</span>'}</td></tr>
                <tr><th>Residente</th><td>${has(s.residenteFoto)?`<img class="avatar" data-zoom src="${esc(s.residenteFoto)}" alt="${esc(s.residente)}">`:''}${has(s.residente)?esc(s.residente):'<span class="placeholder">—</span>'}</td></tr>
              </table>
              ${avance(s)}
              <button class="toggle" type="button">
                <span>Responsables y empresas</span><span class="flecha">▾</span>
              </button>
              <div class="detalle">${detalle(s)}</div>
            </div>
          </div>
        </div>`;
    }

    // meses absolutos para ubicar los hitos por fecha
    const mesAbs = (o, fb) => {
      const y = +(has(o&&o.y)?o.y:(fb&&fb.y)) || 0;
      const m = +(has(o&&o.m)?o.m:1) || 1;
      return y*12 + (m-1);
    };

    function init(){
      // Ordena cronológicamente por fecha de inicio
      const slides = SEGMENTOS.slice().sort((a,b)=>{
        const A=a.inicio, B=b.inicio;
        return (+A.y||9999)-(+B.y||9999) || (+A.m||13)-(+B.m||13) || (+A.d||32)-(+B.d||32);
      });

      // ----- Barra de navegación tipo TimelineJS (marcadores en niveles) -----
      const MW = 160;        // ancho del marcador (px)
      const ROWH = 46;       // alto de cada nivel
      const AXIS_PAD = 36;   // espacio bajo el eje para meses y años
      const PADX = 88;       // margen lateral (≥ medio marcador) para que no se corten los extremos
      // El rango va de la 1ª a la última fecha de INICIO (los hitos), sin estirarse a las fechas de fin
      const inis = slides.map(s=>mesAbs(s.inicio));
      const min = Math.min(...inis) - 1, max = Math.max(...inis) + 1;
      const rangoM = Math.max(max - min, 1);
      // Escala: estira los meses para LLENAR el ancho disponible (sin hueco a la derecha)
      const dispW = document.getElementById('timenav-scroll').clientWidth || 800;
      const PXM = Math.max(40, (dispW - PADX*2) / rangoM);
      const px = m => PADX + (m - min) * PXM;
      const ancho = PADX*2 + rangoM * PXM;

      // Apila los marcadores en niveles para que NO se encimen
      const ordenX = slides.map((s,i)=>({i, x:px(mesAbs(s.inicio))})).sort((a,b)=>a.x-b.x);
      const finNivel = [];   // x derecho ocupado por cada nivel
      const nivelDe = {};
      ordenX.forEach(o=>{
        let r = 0;
        while (finNivel[r]!=null && o.x - MW/2 < finNivel[r] + 12) r++;
        finNivel[r] = o.x + MW/2;
        nivelDe[o.i] = r;
      });
      const niveles = Math.max(finNivel.length, 1);
      const ejeY = niveles*ROWH + 6;
      const innerH = ejeY + AXIS_PAD;

      // Marcas de tiempo: meses (tenues) y años (resaltados en enero)
      let ticks = '';
      for (let m=Math.ceil(min); m<=Math.floor(max); m++){
        const x = px(m), mes = ((m % 12) + 12) % 12;
        if (mes===0)
          ticks += `<div class="tick-anio" style="left:${x}px; top:${ejeY+3}px"><i></i>${Math.floor(m/12)}</div>`;
        else
          ticks += `<div class="tick-mes" style="left:${x}px; top:${ejeY+4}px"><i></i>${MESES[mes+1]}</div>`;
      }

      // Marcadores de tramo (tarjeta + tallo + punto sobre el eje)
      const markers = slides.map((s,i)=>{
        const x = px(mesAbs(s.inicio));
        const cardTop = nivelDe[i]*ROWH;
        const stemTop = cardTop + 34;
        const stemH = Math.max(ejeY - stemTop, 0);
        const per = [fecha(s.inicio), fecha(s.fin)].filter(Boolean).join(' – ');
        return `<div class="marker" data-i="${i}" style="left:${x}px; height:${innerH}px">
                  <div class="m-card" style="top:${cardTop}px"><b>${esc(s.titulo)}</b><span>${esc(per)}</span></div>
                  <div class="m-stem" style="top:${stemTop}px; height:${stemH}px"></div>
                  <div class="m-dot" style="top:${ejeY-6}px"></div>
                </div>`;
      }).join('');

      const inner = document.getElementById('timenav-inner');
      inner.style.width = ancho + 'px';
      inner.style.height = innerH + 'px';
      inner.innerHTML = `<div class="eje" style="top:${ejeY}px"></div>${ticks}${markers}`;

      // Ajusta el tallo de cada marcador a la altura real de su tarjeta (por si el título usa 2 líneas)
      inner.querySelectorAll('.marker').forEach(mk=>{
        const card = mk.querySelector('.m-card');
        const stem = mk.querySelector('.m-stem');
        const top = card.offsetTop + card.offsetHeight + 4;
        stem.style.top = top + 'px';
        stem.style.height = Math.max(ejeY - top, 0) + 'px';
      });

      // Dirección del proyecto (Director / Subdirector)
      document.getElementById('direccion').innerHTML =
        '<div class="dir-wrap">' +
        DIRECCION.filter(d=>has(d.nombre)).map(d=>
          `<div class="dir-card"><span class="dir-rol">${esc(d.rol)}</span><span class="dir-nom">${esc(d.nombre)}</span></div>`
        ).join('') +
        '</div>';

      // Resumen en el encabezado
      document.getElementById('resumen').innerHTML = `
        <div class="chip"><b>${SEGMENTOS.length}</b> tramos</div>
        <div class="chip">KM <b>5+600 a 108+200</b></div>`;

      const slideEl = document.getElementById('slide');
      const prevBtn = document.getElementById('prev');
      const nextBtn = document.getElementById('next');
      const cont    = document.getElementById('contador');
      const scroller  = document.getElementById('timenav-scroll');
      const markerEls = [...document.querySelectorAll('.marker')];
      const tn       = document.getElementById('timenav');
      const tnToggle = document.getElementById('tn-toggle');
      const tnLabel  = document.getElementById('tn-label');
      const tnPrev   = document.getElementById('tn-prev');
      const tnNext   = document.getElementById('tn-next');
      let idx = 0;

      function mostrar(i){
        idx = Math.max(0, Math.min(i, slides.length-1));
        slideEl.innerHTML = slide(slides[idx]);
        markerEls.forEach((e,k)=>e.classList.toggle('activo', k===idx));
        prevBtn.disabled = tnPrev.disabled = idx===0;
        nextBtn.disabled = tnNext.disabled = idx===slides.length-1;
        cont.textContent = `Tramo ${idx+1} de ${slides.length} · usa ‹ › o haz clic en la barra`;
        // Carrusel: centra suavemente el marcador activo
        const mk = markerEls[idx];
        if (mk) scroller.scrollTo({ left: Math.max(0, mk.offsetLeft - scroller.clientWidth/2), behavior:'smooth' });
      }

      prevBtn.addEventListener('click', ()=>mostrar(idx-1));
      nextBtn.addEventListener('click', ()=>mostrar(idx+1));
      tnPrev.addEventListener('click', ()=>mostrar(idx-1));
      tnNext.addEventListener('click', ()=>mostrar(idx+1));
      markerEls.forEach(e=>e.addEventListener('click', ()=>mostrar(+e.dataset.i)));

      // Contraer / expandir la línea del tiempo
      tnToggle.addEventListener('click', ()=>{
        const colap = tn.classList.toggle('colapsado');
        tnToggle.setAttribute('aria-expanded', String(!colap));
        tnLabel.textContent = colap ? 'Mostrar línea del tiempo' : 'Ocultar línea del tiempo';
      });

      // Foto en grande (modal) y desplegar responsables — delegación
      const modal=document.getElementById('modal'), modalImg=document.getElementById('modal-img'), modalPie=document.getElementById('modal-pie');
      document.querySelector('.slide-wrap').addEventListener('click', e=>{
        const foto = e.target.closest('[data-zoom]');
        if (foto){
          modalImg.src = foto.getAttribute('src');
          modalImg.alt = foto.getAttribute('alt') || '';
          modalPie.textContent = foto.getAttribute('alt') || '';
          modal.classList.add('open'); document.body.style.overflow='hidden'; return;
        }
        const btn = e.target.closest('.toggle');
        if (btn) btn.closest('.item').classList.toggle('open');
      });
      function cerrarModal(){ modal.classList.remove('open'); document.body.style.overflow=''; }
      modal.addEventListener('click', e=>{ if (e.target!==modalImg) cerrarModal(); });
      document.addEventListener('keydown', e=>{
        if (e.key==='Escape') cerrarModal();
        else if (e.key==='ArrowLeft')  mostrar(idx-1);
        else if (e.key==='ArrowRight') mostrar(idx+1);
      });

      mostrar(0);
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
