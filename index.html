<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="favicon-tren-691C32-32.png" sizes="32x32">
  <title>Timeline ARTF</title>

  <!-- CSS oficial de TimelineJS -->
  <link title="timeline-styles" rel="stylesheet"
        href="https://cdn.knightlab.com/libs/timeline3/latest/css/timeline.css">

  <style>
    :root {
      /* Colores institucionales EXACTOS */
      --color-institucional: #691c32;      /* vino principal */
      --color-institucional-sec: #96606f;  /* derivado que combine */
      --color-link: #96606f;               /* color de links en texto */

      /* ✅ alto de la franja guinda visible abajo */
      --franja-guinda: 70px; /* ajusta 40–120px */
    }

    /* ========= CUADROS DE EVENTOS (TIMENAV) ========= */
    .tl-timemarker-content-container,
    .tl-timemarker-content-container-long,
    .tl-timemarker-content-container-small {
      background-color: var(--color-institucional);
      color: #ffffff;
      border-radius: 4px;
      border: 1px solid rgba(0,0,0,0.15);
    }

    /* EVENTOS QUE TIENEN RANGO (with-end) */
    .tl-timemarker.tl-timemarker-with-end
      .tl-timemarker-content-container,
    .tl-timemarker.tl-timemarker-with-end
      .tl-timemarker-content-container-long,
    .tl-timemarker.tl-timemarker-with-end
      .tl-timemarker-content-container-small {
      background-color: var(--color-institucional-sec);
    }

    /* ========= LINKS DENTRO DEL TEXTO DE LAS DIAPOSITIVAS ========= */
    .tl-slide .tl-text-content a {
      color: var(--color-link);
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px dashed var(--color-link);
    }
    .tl-slide .tl-text-content a:hover {
      text-decoration: underline;
    }

    /* ========= ACORDEONES (LISTAS DESPLEGABLES) ========= */
    .tl-slide .tl-text-content .accordion {
      margin: 0.4em 0 0.6em 0;
    }
    .tl-slide .tl-text-content .accordion-summary {
      cursor: pointer;
      font-weight: 600;
      padding: 0.25em 0.6em;
      border-radius: 4px;
      display: inline-block;
      background: var(--color-institucional-sec);
      color: #ffffff;
      user-select: none;
    }
    .tl-slide .tl-text-content .accordion-body {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-4px);
      transition:
        max-height 0.35s ease,
        opacity 0.35s ease,
        transform 0.35s ease;
      margin-top: 0.25em;
    }
    .tl-slide .tl-text-content .accordion.is-open .accordion-body {
      max-height: 500px;
      opacity: 1;
      transform: translateY(0);
    }
    .tl-slide .tl-text-content .accordion-body ul {
      margin: 0.3em 0 0 1.2em;
      padding-left: 0;
    }

    .tl-credit{ display:none; }
    .tl-timeline h2.tl-headline-title { white-space: nowrap; }

    html, body {
      background-color: #691C32;
      margin: 0;
      padding: 0;
    }

    /* ✅ “pinta” fijo el fondo guinda abajo (PERO ATRÁS para NO TAPAR FECHAS) */
    body::after{
      content:"";
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: var(--franja-guinda);
      background: #691C32;
      pointer-events: none;
      z-index: -1; /* ✅ CLAVE */
    }

    /* Poner el caption arriba de la foto */
    .tl-media .tl-caption{
      position:absolute;
      top:0; left:0; right:0;
      margin:0;
      padding:12px 16px;
      background: rgba(105, 28, 50, .85);
      color:#fff;
      font-weight:700;
      text-transform:uppercase;
      z-index:20;
    }

    /* Para que no tape la imagen */
    .tl-media .tl-media-content{ padding-top:52px; }

    .titulo-foto{ font-size: x-large; margin-top: 20px; }

    /* Fondo detrás de la imagen (quita negro) */
    #timeline-embed .tl-media,
    #timeline-embed .tl-media-content-container,
    #timeline-embed .tl-media-content,
    #timeline-embed .tl-media-wrapper,
    #timeline-embed .tl-slide-content-container {
      background: #691C32 !important;
    }
    #timeline-embed .tl-media .tl-caption{
      width: 500px !important;
      max-width: calc(100% - 24px) !important;
      margin-top: 12px;
    }

    /* Ocultar iconitos en los time markers (nav) */
    #timeline-embed .tl-timemarker-media-container [class^="tl-icon-"],
    #timeline-embed .tl-timemarker-media-container [class*=" tl-icon-"]{
      display: none !important;
    }

    /* Tarjeta Director */
    #timeline-embed .tl-slide .tl-text-content .role-card{
      margin: 10px 0;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,.22);
      border-left: 4px solid var(--color-institucional-sec);
      background: rgba(255,255,255,.06);
    }
    #timeline-embed .tl-slide .tl-text-content .role-title{
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .5px;
      text-transform: uppercase;
      opacity: .95;
      margin-bottom: 4px;
    }
    #timeline-embed .tl-slide .tl-text-content .role-name{
      font-size: 16px;
      font-weight: 700;
      line-height: 1.1;
    }

    /* Por si quedan listas, quita viñetas dentro del slide */
    #timeline-embed .tl-slide .tl-text-content ul{
      list-style: none;
      padding-left: 0;
      margin-left: 0;
    }

    /* Tarjetas de residentes */
    #timeline-embed .tl-slide .tl-text-content .resident-card{
      margin: 12px 0;
      padding: 10px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.05);
    }
    #timeline-embed .tl-slide .tl-text-content .resident-card hr{
      border: 0;
      border-top: 1px solid rgba(255,255,255,.18);
      margin: 10px 0;
    }
    #timeline-embed .tl-slide .tl-text-content .resident-card td{
      line-height: 1.25;
    }
    #timeline-embed .tl-slide .tl-text-content .resident-card{
      margin: 14px 0;
    }
    #timeline-embed .tl-slide .tl-text-content .resident-card + .resident-card{
      position: relative;
      padding-top: 14px;
    }
    #timeline-embed .tl-slide .tl-text-content .resident-card + .resident-card:before{
      content:"";
      position:absolute;
      top:0; left:0; right:0;
      height:1px;
      background: rgba(255,255,255,.18);
    }

    /*Dividers*/
    #timeline-embed .tl-slide .tl-text-content .divider{
      height: 1px;
      margin: 14px 0;
      background: linear-gradient(
        90deg,
        rgba(255,255,255,0),
        rgba(255,255,255,.28),
        rgba(255,255,255,0)
      );
    }

    /* SOLO para la diapositiva marcada como .slide-2 */
    #timeline-embed .tl-slide:has(.slide-2) .tl-media .tl-media-content{
      padding-top: 1px !important;
    }

    /* ===== Contenedor timeline ===== */
    .timeline-wrap{
      width: 100%;
      height: calc(100vh - var(--franja-guinda));
      min-height: 650px;
      overflow: hidden;
      position: relative;
      --collapsed-safe-bottom: 90px; /* ajusta 70–120 si quieres más/menos */
      z-index: 1;
    }

    /* ✅ NUEVO: al cargar, Timeline se renderiza pero NO se ve (evita flash y evita bug de tamaños) */
    .timeline-wrap.is-prehide #timeline-embed{
      opacity: 0;
    }

    #timeline-embed{
      width: 100%;
      height: 100%;
      transition: opacity .12s ease;
    }

    /* ====== evitar blancos en el área del story ====== */
    #timeline-embed .tl-timeline,
    #timeline-embed .tl-storyslider,
    #timeline-embed .tl-storyslider .tl-slider-container{
      background: #691C32 !important;
    }

    /* ✅ OCULTAR SOLO el bloque inferior completo (timenav + wrappers) */
    .timeline-wrap.is-collapsed #timeline-embed .tl-timenav,
    .timeline-wrap.is-collapsed #timeline-embed .tl-timenav-wrapper,
    .timeline-wrap.is-collapsed #timeline-embed .tl-timenav-container,
    .timeline-wrap.is-collapsed #timeline-embed .tl-menubar{
      display: none !important;
      height: 0 !important;
      min-height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
    }

    /* ✅ que el story use TODO el alto cuando se oculta timenav */
    .timeline-wrap.is-collapsed #timeline-embed .tl-storyslider{
      bottom: 0 !important;
      height: 100% !important;
    }

    /* ✅ “colchón” scrollable al final (para que el contenido suba y quede la franja) */
    .timeline-wrap.is-collapsed #timeline-embed .tl-slide .tl-slide-scrollable-container,
    .timeline-wrap.is-collapsed #timeline-embed .tl-slide .tl-slide-content-container,
    .timeline-wrap.is-collapsed #timeline-embed .tl-slide .tl-text-content{
      padding-bottom: var(--collapsed-safe-bottom) !important;
      box-sizing: border-box;
    }

    /* Botón: siempre ARRIBA de la barra de fechas */
    .timeline-toggle{
      position:absolute;
      right: 14px;
      bottom: var(--toggle-bottom, 130px);
      z-index: 99999;
      background: rgba(0,0,0,.18);
      border: 1px solid rgba(255,255,255,.45);
      color:#fff;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .8px;
      text-transform: uppercase;
      cursor:pointer;
      backdrop-filter: blur(4px);
    }
    .timeline-toggle:hover{
      background: rgba(0,0,0,.28);
      cursor: pointer !important;
    }

    #toggle-timeline,
    #toggle-timeline:hover,
    #toggle-timeline:active,
    #toggle-timeline:focus,
    #toggle-timeline *{
      cursor: pointer !important;
    }

    /* ✅ Ocultar el badge/credit de TimelineJS (logo + link) */
#timeline-embed .tl-credit,
#timeline-embed .tl-attribution,
#timeline-embed .tl-attribution a,
#timeline-embed .tl-attribution .tl-logo,
#timeline-embed a.tl-logo,
#timeline-embed a.tl-credit,
.tl-credit,
.tl-attribution{
  display: none !important;
}

/* ✅ Evita el “brinco” del botón al cargar */
.timeline-wrap.is-prehide{
  --toggle-bottom: 10px; /* desde el inicio, ya queda abajo */
}

/* ✅ No muestres el botón mientras TimelineJS termina de medir */
.timeline-wrap.is-prehide .timeline-toggle{
  opacity: 0 !important;
  pointer-events: none !important;
  transform: translateY(10px);
  transition: opacity .15s ease, transform .15s ease;
}

/* ✅ Cuando ya cargó (al quitar is-prehide), aparece limpio */
.timeline-wrap .timeline-toggle{
  transition: opacity .15s ease, transform .15s ease;
}


  </style>
</head>

<body>
  <!-- ✅ Arranca “prehide” (invisible) y el botón ya dice MOSTRAR -->
  <div id="timeline-wrap" class="timeline-wrap is-prehide">
    <div id="timeline-embed"></div>

    <button id="toggle-timeline" class="timeline-toggle" type="button" aria-expanded="false">
      Mostrar Cronología
    </button>
  </div>

  <!-- JS de TimelineJS -->
  <script src="https://cdn.knightlab.com/libs/timeline3/latest/js/timeline.js"></script>
  <script>
    // Tu "source"
    var source = "v2:2PACX-1vTrhzy-gOn-UThOEccNA7-5ijY_ln-13xyFrHTlreZAJ0aGprAysbyfkzcWrr94FcZoDQTi3zowxELi";

    // Crear timeline
    window.timeline = new TL.Timeline("timeline-embed", source, {
      language: "es",
      initial_zoom: 0,
      font: "Default"
    });

    // ========= Acordeón =========
    document.addEventListener('click', function (e) {
      const summary = e.target.closest('.accordion-summary');
      if (!summary) return;
      if (e.target.tagName === 'A') return;

      const accordion = summary.closest('.accordion');
      if (!accordion) return;

      accordion.classList.toggle('is-open');
    });

    const wrap = document.getElementById('timeline-wrap');
    const btn  = document.getElementById('toggle-timeline');

    function refreshTimelineHard(){
      requestAnimationFrame(() => {
        void wrap.offsetHeight;
        window.timeline?.updateDisplay?.();
        setTimeout(() => window.timeline?.updateDisplay?.(), 60);
        setTimeout(() => window.timeline?.updateDisplay?.(), 220); /* extra por si acaso */
      });
    }

    function updateToggleOffset(){
      if (wrap.classList.contains('is-collapsed')) {
        wrap.style.setProperty('--toggle-bottom', '10px');
        return true;
      }

      const nav = document.querySelector('#timeline-embed .tl-timenav');
      const gap = 10;
      if (!nav) return false;

      const navH = Math.ceil(nav.getBoundingClientRect().height);
      if (navH <= 0) return false;

      wrap.style.setProperty('--toggle-bottom', (navH + gap) + 'px');
      return true;
    }

    (function ensureFirstCorrectButtonPosition(){
      let tries = 0;
      const maxTries = 240;

      const tick = () => {
        tries++;
        const ok = updateToggleOffset();
        if (ok || tries >= maxTries) return;
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    })();

    const embed = document.getElementById('timeline-embed');
    const mo = new MutationObserver(() => updateToggleOffset());
    mo.observe(embed, { childList: true, subtree: true });

    // ✅ NUEVO: esperar a que exista la barra (.tl-timenav) y luego arrancar colapsado (sin romper tamaños)
    (function startCollapsedAfterReady(){
      let tries = 0;
      const maxTries = 240;    
      const tick = () => {
        tries++;

        const nav = document.querySelector('#timeline-embed .tl-timenav');
        const ok = nav && nav.getBoundingClientRect().height > 0;

        if (ok) {
          wrap.classList.add('is-collapsed');// arranca oculto
          wrap.classList.remove('is-prehide');// ya se puede ver
          btn.textContent = 'Mostrar Cronología';
          btn.setAttribute('aria-expanded', 'false');
          wrap.style.setProperty('--toggle-bottom', '10px');
          refreshTimelineHard();
          return;
        }

        if (tries >= maxTries) {
          // si por algo no detecta, al menos quita prehide para que se vea
          wrap.classList.remove('is-prehide');
          refreshTimelineHard();
          return;
        }

        requestAnimationFrame(tick);
      };

      requestAnimationFrame(tick);
    })();

    btn.addEventListener('click', () => {
      const willCollapse = !wrap.classList.contains('is-collapsed');
      wrap.classList.toggle('is-collapsed', willCollapse);

      if (willCollapse) {
        btn.textContent = 'Mostrar Cronología';
        btn.setAttribute('aria-expanded', 'false');
        wrap.style.setProperty('--toggle-bottom', '10px');
      } else {
        btn.textContent = 'OCULTAR';
        btn.setAttribute('aria-expanded', 'true');
        updateToggleOffset();
      }

      refreshTimelineHard();
    });

    window.addEventListener('resize', () => {
      updateToggleOffset();
      refreshTimelineHard();
    });
  </script>
</body>
</html>
